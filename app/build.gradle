plugins {
    id 'com.android.application'
}

android {
    namespace 'tv.aurora.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'tv.aurora.launcher'
        minSdk 21
        targetSdk 28
        versionCode 5
        versionName '0.5.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
